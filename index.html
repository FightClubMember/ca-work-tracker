// Sync with Vercel Serverless /api/db endpoint if online
async function syncNeonData() {
  try {
    const res = await fetch('/api/db?type=all');
    if (res.ok) {
      const data = await res.json();
      if (data.users && data.users.length) {
        state.db.users = data.users;
        state.db.clients = data.clients;
        state.db.tasks = data.tasks;
        state.db.logs = data.logs;
        state.db.compliances = data.compliances;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.db));
        render();
      }
    }
  } catch (err) {
    // Falls back seamlessly to offline / local state
  }
}

// Call API to persist to Neon
async function cloudSync(action, table, data, id) {
  try {
    await fetch('/api/db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, table, data, id })
    });
  } catch(e) {}
}

const saveLocalAndCloud = (action, table, data, id) => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.db));
  if (action) cloudSync(action, table, data, id);
};

// Helper utils
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* -------------------------------------------------------------
   AUTHENTICATION
------------------------------------------------------------- */
async function loginUser(username, password) {
  const hash = await sha256(password);
  const user = state.db.users.find(u => u.username.toLowerCase() === username.trim().toLowerCase() && (u.password_hash === hash || u.passHash === hash));
  if (!user) {
    alert('Invalid username or password!');
    return false;
  }
  state.session = { id: user.id, username: user.username, name: user.name, role: user.role, clientId: user.client_id || user.clientId };
  sessionStorage.setItem(STORAGE_KEY + '_session', JSON.stringify(state.session));
  state.currentTab = user.role === 'Client' ? 'client_portal' : 'dashboard';
  render();
  return true;
}

function logoutUser() {
  state.session = null;
  sessionStorage.removeItem(STORAGE_KEY + '_session');
  render();
}

function quickLogin(u, p) {
  loginUser(u, p);

function saveTask(id, form) {
  const data = {
    id: id || uid(),
    client: form.client.value,
    type: form.type.value,
    title: form.title.value.trim(),
    emp: form.emp.value,
    due: form.due.value,
    priority: form.priority.value,
    status: form.status.value,
    estHours: 5,
    billable: true
  };
  if (id) {
    const idx = state.db.tasks.findIndex(x => x.id === id);
    if (idx !== -1) state.db.tasks[idx] = Object.assign(state.db.tasks[idx], data);
  } else {
    state.db.tasks.push(data);
  }
  saveLocalAndCloud('insert', 'tasks', data);
  closeModal();
  render();
}

function markTaskDone(id) {
  const t = state.db.tasks.find(x => x.id === id);
  if (!t) return;
  const hours = prompt('Hours spent on this task:', '2');
  t.status = 'Completed';
  t.completedOn = todayStr();
  t.completedBy = state.session.id;

  const logData = {
    id: uid(),
    date: todayStr(),
    client: t.client,
    emp: state.session.id,
    work: `Completed: ${t.type} - ${t.title}`,
    hours: parseFloat(hours) || 1,
    billable: true
  };
  state.db.logs.push(logData);

  saveLocalAndCloud('update_task_done', 'tasks', { completedOn: t.completedOn, completedBy: t.completedBy }, id);
  saveLocalAndCloud('insert', 'logs', logData);
  render();
}

        <button class="btn sec sm" onclick="closeModal()">✕</button>
      </div>
      <form onsubmit="event.preventDefault(); saveLog('${id||''}', this);">
        <div class="grid-2">
          <div class="field-grp">
            <label>Date</label>
            <input type="date" name="date" required value="${l ? l.date : todayStr()}">
          </div>
          <div class="field-grp">
            <label>Hours Spent</label>
            <input type="number" step="0.25" min="0.25" name="hours" required value="${l ? l.hours : '1.0'}">
          </div>
        </div>
        <div class="field-grp">
          <label>Client</label>
          <select name="client" required>
            ${state.db.clients.map(c => `<option value="${c.id}" ${l&&l.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field-grp">
          <label>Work Carried Out / Remarks</label>
          <textarea name="work" rows="3" required placeholder="Describe specific sections, returns, vouchers verified...">${esc(l ? l.work : '')}</textarea>
        </div>
        <div class="field-grp">
          <label>
            <input type="checkbox" name="billable" ${!l || l.billable ? 'checked' : ''}> Billable Activity
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn sec" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Log Time</button>
        </div>
      </form>
    </div>
  </div>`;
}

function saveLog(id, form) {
  const data = {
    id: id || uid(),
    date: form.date.value,
    hours: parseFloat(form.hours.value) || 0,
    client: form.client.value,
    emp: state.session.id,
    work: form.work.value.trim(),
    billable: form.billable.checked
  };
  if (id) {
    const idx = state.db.logs.findIndex(x => x.id === id);
    if (idx !== -1) state.db.logs[idx] = Object.assign(state.db.logs[idx], data);
  } else {
    state.db.logs.push(data);
  }
  saveLocalAndCloud('insert', 'logs', data);
  closeModal();
  render();
}

function clientModal(id) {
  const c = id ? state.db.clients.find(x => x.id === id) : null;
  document.getElementById('modalContainer').innerHTML = `
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <h3>${c ? 'Edit Client Details' : 'Register New Client'}</h3>
        <button class="btn sec sm" onclick="closeModal()">✕</button>
      </div>
      <form onsubmit="event.preventDefault(); saveClient('${id||''}', this);">
        <div class="field-grp">
          <label>Client Entity Name</label>
          <input type="text" name="name" required value="${esc(c ? c.name : '')}" placeholder="e.g. Acme Industrial Solutions Pvt Ltd">
        </div>
        <div class="grid-2">
          <div class="field-grp">
            <label>Constitution</label>
            <select name="type">
              <option value="Company" ${c&&c.type==='Company'?'selected':''}>Company</option>
              <option value="Partnership/LLP" ${c&&c.type==='Partnership/LLP'?'selected':''}>Partnership / LLP</option>
              <option value="Individual" ${c&&c.type==='Individual'?'selected':''}>Individual</option>
            </select>
          </div>
          <div class="field-grp">
            <label>Hourly Rate (₹)</label>
            <input type="number" name="rate" value="${c ? c.billing_rate || 1500 : 1500}">
          </div>
        </div>
        <div class="grid-2">
          <div class="field-grp">
            <label>PAN Number</label>
            <input type="text" name="pan" value="${esc(c ? c.pan : '')}" placeholder="ABCDE1234F">
          </div>
          <div class="field-grp">
            <label>GSTIN</label>
            <input type="text" name="gstin" value="${esc(c ? c.gstin : '')}" placeholder="27ABCDE1234F1Z5">
          </div>
        </div>
        <div class="grid-2">
          <div class="field-grp">
            <label>Phone / WhatsApp</label>
            <input type="text" name="phone" value="${esc(c ? c.phone : '')}">
          </div>
          <div class="field-grp">
            <label>Official Email</label>
            <input type="email" name="email" value="${esc(c ? c.email : '')}">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn sec" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Save Client</button>
        </div>
      </form>
    </div>
  </div>`;
}

function saveClient(id, form) {
  const data = {
    id: id || uid(),
    name: form.name.value.trim(),
    type: form.type.value,
    billingRate: parseFloat(form.rate.value) || 1500,
    pan: form.pan.value.trim().toUpperCase(),
    gstin: form.gstin.value.trim().toUpperCase(),
    phone: form.phone.value.trim(),
    email: form.email.value.trim()
  };
  if (id) {
    const idx = state.db.clients.findIndex(x => x.id === id);
    if (idx !== -1) state.db.clients[idx] = Object.assign(state.db.clients[idx], data);
  } else {
    state.db.clients.push(data);
  }
  saveLocalAndCloud('insert', 'clients', data);
  closeModal();
  render();
}

function userModal() {
  document.getElementById('modalContainer').innerHTML = `
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-hdr">
        <h3>Create New Multi-ID User Access</h3>
        <button class="btn sec sm" onclick="closeModal()">✕</button>
      </div>
      <form onsubmit="event.preventDefault(); createUser(this);">
        <div class="field-grp">
          <label>Login Username</label>
          <input type="text" name="un" required placeholder="e.g. pooja" autocomplete="off">
        </div>
        <div class="field-grp">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="e.g. Pooja Iyer">
        </div>
        <div class="field-grp">
          <label>Role</label>
          <select name="role" id="newUserRole">
            <option value="Staff">Staff / Article Assistant</option>
            <option value="Manager">Manager / Senior</option>
            <option value="Admin">Partner / Admin</option>
            <option value="Client">Client Representative</option>
          </select>
        </div>
        <div class="field-grp">
          <label>Password</label>
          <input type="password" name="pw" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn sec" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Create Account</button>
        </div>
      </form>
    </div>
  </div>`;
}

async function createUser(form) {
  const un = form.un.value.trim().toLowerCase();
  if (state.db.users.some(u => u.username.toLowerCase() === un)) {
    alert('Username already exists!');
    return;
  }
  const hash = await sha256(form.pw.value);
  const data = {
    id: uid(),
    username: un,
    name: form.name.value.trim(),
    role: form.role.value,
    password_hash: hash,
    email: '',
    client_id: null
  };
  state.db.users.push(data);
  saveLocalAndCloud('insert', 'users', data);
  closeModal();
  render();
}

async function resetUserPasswordModal(userId) {
  const u = state.db.users.find(x => x.id === userId);
  const newPass = prompt(`Enter new password for @${u.username}:`);
  if (!newPass) return;
  u.password_hash = await sha256(newPass);
  saveLocalAndCloud('insert', 'users', u);
  alert(`Password for @${u.username} updated!`);
}

async function changePassword(curPass, newPass) {
  const curHash = await sha256(curPass);
  const u = state.db.users.find(x => x.id === state.session.id);
  if (!u || (u.password_hash !== curHash && u.passHash !== curHash)) {
    alert('Current password incorrect!');
    return;
  }
  u.password_hash = await sha256(newPass);
  saveLocalAndCloud('insert', 'users', u);
  alert('Password updated successfully!');
}

function deleteItem(tbl, id) {
  if (!confirm('Are you sure you want to delete this record from the database?')) return;
  state.db[tbl] = state.db[tbl].filter(x => x.id !== id);
  saveLocalAndCloud('delete', tbl, null, id);
  render();
}

/* -------------------------------------------------------------
   RENDER LOOP
------------------------------------------------------------- */
function render() {
  const topNavUser = document.getElementById('topNavUser');
  const nav = document.getElementById('mainNav');
  const app = document.getElementById('appView');

  if (!state.session) {
    topNavUser.innerHTML = '';
    nav.innerHTML = '';
    app.innerHTML = Views.login();
    return;
  }

  topNavUser.innerHTML = `
    <div class="user-pill">
      <div class="user-avatar">${state.session.name.charAt(0)}</div>
      <div>
        <b>${esc(state.session.name)}</b>
        <span style="opacity:0.7;font-size:11px;">(${state.session.role})</span>
      </div>
    </div>
    <button class="btn sec sm" onclick="logoutUser()">Logout</button>
  `;

  const tabs = getTabs();
  nav.innerHTML = tabs.map(([k, lbl]) => `
    <button class="${state.currentTab === k ? 'active' : ''}" onclick="state.currentTab='${k}';render();">
      ${lbl}
    </button>
  `).join('');

  const viewFn = Views[state.currentTab] || Views.dashboard;
  app.innerHTML = viewFn();
}

// Initial sync and render
syncNeonData();
render();
</script>
</body>
</html>
