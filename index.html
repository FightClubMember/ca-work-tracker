<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YMC &amp; ASSOCIATES Work Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2733;--mut:#6b7684;--bd:#e3e0d8;--pri:#1f4e79;--pritx:#fff;--ok:#1e7a46;--okbg:#e2f3e9;--wa:#9a5b00;--wabg:#fdf0d8;--bad:#b3261e;--badbg:#fbe4e2;--inf:#1f4e79;--infbg:#e1ecf7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232b;--tx:#e8ebef;--mut:#99a3b0;--bd:#2d3540;--pri:#5b9bd5;--pritx:#0d1520;--ok:#6fd09a;--okbg:#17342500;--wa:#f0b45a;--wabg:#3a2d12;--bad:#f2928b;--badbg:#3d1c1a;--inf:#8dbbe6;--infbg:#1b2b3d;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:var(--pritx);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font:600 18px Georgia,serif}header small{opacity:.8}
.hdr-right{display:flex;align-items:center;gap:10px;font-size:13px}
.hdr-user{background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.2)}
.hdr-user b{color:#fff}
.hdr-btn{background:#fff;color:var(--pri);border:0;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
nav{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--card)}
nav button{border:0;background:none;color:var(--mut);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.stat b{display:block;font-size:28px;font-family:Georgia,serif}.stat span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:15px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
textarea{width:100%;min-height:70px}
.btn{background:var(--pri);color:var(--pritx);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--pri);border:1px solid var(--bd)}.btn.s{padding:4px 9px;font-size:13px}.btn.d{background:none;color:var(--bad);border:1px solid var(--bd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th,td{padding:8px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
tr.od td:first-child{box-shadow:inset 3px 0 var(--bad)}
.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.Pending{background:var(--wabg);color:var(--wa)}.In-Progress{background:var(--infbg);color:var(--inf)}.Completed{background:var(--okbg);color:var(--ok)}
.High{background:var(--badbg);color:var(--bad)}.Medium{background:var(--wabg);color:var(--wa)}.Low{background:var(--infbg);color:var(--inf)}
.mut{color:var(--mut)}.empty{padding:22px;text-align:center;color:var(--mut)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.md h3{margin:0 0 12px}.md label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}.md input,.md select{width:100%}
.md .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:4px}
.chip-login{background:var(--card);border:1px solid var(--bd);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.chip-login:hover{border-color:var(--pri);color:var(--pri)}
</style>
</head>
<body>
<header>
  <div>
    <h1>YMC &amp; ASSOCIATES Work Tracker</h1>
    <small><span class="sync-dot"></span>Neon PostgreSQL Cloud Synced &bull; Client-wise daily records, pending tasks and team progress</small>
  </div>
  <div class="hdr-right" id="hdrUser"></div>
</header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="m"></div>
<script>
const K = 'cafirm_v2';
let db = {
  users: [
    { id: 'usr_admin', username: 'admin', passHash: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918', name: 'CA Yash Mehta (Admin)', role: 'Admin' },
    { id: 'usr_mgr', username: 'manager', passHash: 'e6c279e8a5b28a9b4009e53096b744d03d011f0088031e8460dd804dfa29910d', name: 'Sneha Patel (Manager)', role: 'Manager' },
    { id: 'usr_staff1', username: 'rohit', passHash: 'f4f10714777559e2b146e25dc7d03df62ef58667b2d561d31cfc2df36294b41a', name: 'Rohit Sharma (Article)', role: 'Staff' }
  ],
  clients: [],
  emps: [],
  tasks: [],
  logs: []
};

let currentUser = null;

try {
  const s = localStorage.getItem(K);
  if (s) db = Object.assign(db, JSON.parse(s));
  const u = sessionStorage.getItem(K + '_u');
  if (u) currentUser = JSON.parse(u);
} catch(e) {}

const save = (action, table, data, id) => {
  try {
    localStorage.setItem(K, JSON.stringify(db));
    if (action) {
      fetch('/api/db', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, table, data, id })
      }).catch(() => {});
    }
  } catch(e) {}
};

async function syncWithNeon() {
  try {
    const res = await fetch('/api/db?type=all');
    if (res.ok) {
      const data = await res.json();
      if (data.users && data.users.length) {
        db.users = data.users.map(u => ({ id: u.id, username: u.username, passHash: u.password_hash, name: u.name, role: u.role }));
        db.clients = data.clients;
        db.emps = data.users.filter(u => u.role !== 'Client').map(u => ({ id: u.id, name: u.name, role: u.role }));
        db.tasks = data.tasks;
        db.logs = data.logs;
        localStorage.setItem(K, JSON.stringify(db));
        render();
      }
    }
  } catch(e) {}
}

async function sha256(msg) {
  const b = new TextEncoder().encode(msg);
  const h = await crypto.subtle.digest('SHA-256', b);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmt = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cn = id => (db.clients.find(c => c.id == id) || {}).name || '—';
const en = id => (db.emps.find(c => c.id == id) || {}).name || '—';

const WT = ['GST Return', 'Income Tax Return', 'TDS/TCS', 'Audit', 'ROC/MCA Filing', 'Bookkeeping', 'Accounting', 'Notice/Appeal', 'Payroll/PF/ESI', 'Other'];
const TABS = [
  ['dash', 'Dashboard'],
  ['tasks', 'Pending Tasks'],
  ['log', 'Daily Work Log'],
  ['clients', 'Clients'],
  ['team', 'Team'],
  ['users', 'Multi-ID & Passwords']
];

let tab = 'dash', f = { ts: 'Open', tc: '', te: '', ld: today(), le: '', lc: '' };
const opt = (arr, sel, all) => (all != null ? `<option value="">${all}</option>` : '') + arr.map(a => { const [v, l] = Array.isArray(a) ? a : [a, a]; return `<option value="${esc(v)}"${v == sel ? ' selected' : ''}>${esc(l)}</option>`; }).join('');
const cOpts = () => db.clients.map(c => [c.id, c.name]);
const eOpts = () => db.emps.map(c => [c.id, c.name]);
const isOd = t => t.status !== 'Completed' && t.due && t.due < today();

function form(title, fields, vals, onSave) {
  vals = vals || {};
  m.innerHTML = `<div class="ov"><div class="md"><h3>${title}</h3>${fields.map(x => {
    const v = vals[x.k] != null ? vals[x.k] : (x.def || '');
    let i;
    if (x.t === 'select') i = `<select id="f_${x.k}">${opt(x.o, v)}</select>`;
    else if (x.t === 'area') i = `<textarea id="f_${x.k}">${esc(v)}</textarea>`;
    else i = `<input id="f_${x.k}" type="${x.t || 'text'}" value="${esc(v)}"${x.t === 'number' ? ' step="0.25" min="0"' : ''}>`;
    return `<label>${x.l}${x.r ? ' *' : ''}</label>${i}`;
  }).join('')}
  <div class="act"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" id="sv">Save</button></div></div></div>`;
  
  document.getElementById('sv').onclick = () => {
    const o = {};
    for (const x of fields) {
      o[x.k] = document.getElementById('f_' + x.k).value.trim();
      if (x.r && !o[x.k]) { alert('Please fill: ' + x.l); return; }
    }
    onSave(o);
    closeM();
    render();
  };
}

const closeM = () => { m.innerHTML = ''; };
function needBase() {
  if (!db.clients.length) { alert('Please add a client first (Clients tab).'); return true; }
  if (!db.emps.length) { alert('Please add team members first (Team tab).'); return true; }
  return false;
}

/* Authentication */
async function login(un, pw) {
  const hash = await sha256(pw);
  const u = db.users.find(x => x.username.toLowerCase() === un.trim().toLowerCase() && (x.passHash === hash || x.password_hash === hash));
  if (!u) {
    alert('Invalid username or password');
    return;
  }
  currentUser = u;
  sessionStorage.setItem(K + '_u', JSON.stringify(currentUser));
  render();
}

function logout() {
  currentUser = null;
  sessionStorage.removeItem(K + '_u');
  render();
}

function taskForm(id) {
  if (needBase()) return;
  const t = db.tasks.find(x => x.id === id);
  form(t ? 'Edit task' : 'New task', [
    { k: 'client', l: 'Client', t: 'select', o: cOpts(), r: 1 },
    { k: 'type', l: 'Work type', t: 'select', o: WT },
    { k: 'title', l: 'Task details', r: 1 },
    { k: 'emp', l: 'Assigned to', t: 'select', o: eOpts(), r: 1 },
    { k: 'due', l: 'Due date', t: 'date' },
    { k: 'priority', l: 'Priority', t: 'select', o: ['High', 'Medium', 'Low'], def: 'Medium' },
    { k: 'status', l: 'Status', t: 'select', o: ['Pending', 'In Progress', 'Completed'], def: 'Pending' }
  ], t, o => {
    if (t) {
      Object.assign(t, o);
      save('insert', 'tasks', t);
    } else {
      const newTask = { id: uid(), created: today(), ...o };
      db.tasks.push(newTask);
      save('insert', 'tasks', newTask);
    }
  });
}

function completeTask(id) {
  const t = db.tasks.find(x => x.id === id);
  form('Mark complete', [
    { k: 'emp', l: 'Completed by', t: 'select', o: eOpts(), def: (currentUser ? currentUser.id : t.emp), r: 1 },
    { k: 'date', l: 'Date completed', t: 'date', def: today(), r: 1 },
    { k: 'hours', l: 'Hours spent', t: 'number' },
    { k: 'note', l: 'Notes (optional)', t: 'area' }
  ], { emp: t.emp }, o => {
    t.status = 'Completed';
    t.completedOn = o.date;
    t.completedBy = o.emp;
    save('update_task_done', 'tasks', { completedOn: o.date, completedBy: o.emp }, t.id);

    const newLog = {
      id: uid(),
      date: o.date,
      client: t.client,
      emp: o.emp,
      work: t.type + ': ' + t.title + (o.note ? ' (' + o.note + ')' : ''),
      hours: o.hours,
      task: t.id
    };
    db.logs.push(newLog);
    save('insert', 'logs', newLog);
  });
}

function logForm(id) {
  if (needBase()) return;
  const l = db.logs.find(x => x.id === id);
  form(l ? 'Edit entry' : 'Add work done', [
    { k: 'date', l: 'Date', t: 'date', def: today(), r: 1 },
    { k: 'client', l: 'Client', t: 'select', o: cOpts(), r: 1 },
    { k: 'emp', l: 'Done by (employee)', t: 'select', o: eOpts(), def: (currentUser ? currentUser.id : ''), r: 1 },
    { k: 'work', l: 'Work done', t: 'area', r: 1 },
    { k: 'hours', l: 'Hours spent', t: 'number' }
  ], l, o => {
    if (l) {
      Object.assign(l, o);
      save('insert', 'logs', l);
    } else {
      const newLog = { id: uid(), ...o };
      db.logs.push(newLog);
      save('insert', 'logs', newLog);
    }
  });
}

function clientForm(id) {
  const c = db.clients.find(x => x.id === id);
  form(c ? 'Edit client' : 'New client', [
    { k: 'name', l: 'Client name', r: 1 },
    { k: 'type', l: 'Type', t: 'select', o: ['Individual', 'Proprietorship', 'Partnership/LLP', 'Company', 'Trust/Other'] },
    { k: 'pan', l: 'PAN' },
    { k: 'gstin', l: 'GSTIN' },
    { k: 'phone', l: 'Contact Phone' },
    { k: 'email', l: 'Email' }
  ], c, o => {
    if (c) {
      Object.assign(c, o);
      save('insert', 'clients', c);
    } else {
      const newC = { id: uid(), ...o };
      db.clients.push(newC);
      save('insert', 'clients', newC);
    }
  });
}

function empForm() {
  form('Add team member', [
    { k: 'name', l: 'Employee name', r: 1 },
    { k: 'role', l: 'Role (e.g. Article, Accountant, Partner)', r: 1 }
  ], null, o => {
    const newEmp = { id: uid(), ...o };
    db.emps.push(newEmp);
    save('insert', 'users', { id: newEmp.id, username: newEmp.name.toLowerCase().replace(/\s+/g, ''), name: newEmp.name, role: newEmp.role, password_hash: '' });
  });
}

function userForm() {
  form('Create User ID & Password', [
    { k: 'username', l: 'Username / Login ID', r: 1 },
    { k: 'name', l: 'Display Name', r: 1 },
    { k: 'role', l: 'Role', t: 'select', o: ['Staff', 'Manager', 'Admin'], def: 'Staff' },
    { k: 'password', l: 'Password', r: 1 }
  ], null, async o => {
    const hash = await sha256(o.password);
    const newU = { id: uid(), username: o.username.toLowerCase(), name: o.name, role: o.role, passHash: hash, password_hash: hash };
    db.users.push(newU);
    db.emps.push({ id: newU.id, name: newU.name, role: newU.role });
    save('insert', 'users', newU);
    alert('User @' + o.username + ' created successfully!');
    render();
  });
}

async function resetUserPass(id) {
  const u = db.users.find(x => x.id === id);
  const p = prompt('Set new password for @' + u.username + ':');
  if (!p) return;
  u.passHash = await sha256(p);
  u.password_hash = u.passHash;
  save('insert', 'users', u);
  alert('Password updated for @' + u.username);
  render();
}

function del(k, id, msg) {
  if (confirm(msg || 'Delete this record?')) {
    db[k] = db[k].filter(x => x.id !== id);
    if (k === 'clients') {
      db.tasks = db.tasks.filter(x => x.client !== id);
      db.logs = db.logs.filter(x => x.client !== id);
    }
    save('delete', k, null, id);
    render();
  }
}

function clientView(id) {
  const c = db.clients.find(x => x.id === id);
  if (!c) return;
  const ts = db.tasks.filter(t => t.client === id);
  const ls = db.logs.filter(l => l.client === id).sort((a, b) => b.date.localeCompare(a.date));

  m.innerHTML = `<div class="ov"><div class="md" style="max-width:620px">
    <h3>${esc(c.name)}</h3>
    <div class="mut">${esc(c.type || '')} ${c.pan ? '· PAN: ' + esc(c.pan) : ''} ${c.gstin ? '· GST: ' + esc(c.gstin) : ''} ${c.phone ? '· ' + esc(c.phone) : ''}</div>
    <h4>Open tasks</h4>
    ${ts.filter(t => t.status !== 'Completed').map(t => `<div>${isOd(t) ? '⚠ ' : ''}${esc(t.type)}: ${esc(t.title)} <span class="mut">· ${esc(en(t.emp))} · due ${fmt(t.due)}</span></div>`).join('') || '<div class="mut">None</div>'}
    <h4>Work history</h4>
    ${ls.slice(0, 25).map(l => `<div>${fmt(l.date)} — ${esc(l.work)} <span class="mut">· ${esc(en(l.emp))}${l.hours ? ' · ' + esc(l.hours) + 'h' : ''}</span></div>`).join('') || '<div class="mut">No work recorded yet</div>'}
    <div class="act"><button class="btn" onclick="closeM()">Close</button></div>
  </div></div>`;
}

function taskRows(list) {
  return list.length ? `<div class="tw"><table><tr><th>Due</th><th>Client</th><th>Work</th><th>Assigned</th><th>Priority</th><th>Status</th><th></th></tr>${list.map(t => `<tr class="${isOd(t) ? 'od' : ''}"><td>${fmt(t.due)}${isOd(t) ? '<br><span class="b High">Overdue</span>' : ''}</td><td>${esc(cn(t.client))}</td><td><b>${esc(t.type)}</b><br>${esc(t.title)}</td><td>${esc(en(t.emp))}</td><td><span class="b ${t.priority}">${t.priority}</span></td><td><span class="b ${t.status.replace(' ', '-')}">${t.status}</span>${t.completedOn ? '<br><span class="mut">' + fmt(t.completedOn) + ' by ' + esc(en(t.completedBy)) + '</span>' : ''}</td><td style="white-space:nowrap">${t.status !== 'Completed' ? `<button class="btn s" onclick="completeTask('${t.id}')">Complete</button> ` : ''}<button class="btn g s" onclick="taskForm('${t.id}')">Edit</button> <button class="btn d s" onclick="del('tasks','${t.id}')">✕</button></td></tr>`).join('')}</table></div>` : '<div class="empty">No tasks found.</div>';
}

const V = {
  login() {
    return `<div class="panel" style="max-width:440px;margin:50px auto;padding:24px;">
      <h2 style="font-size:18px;margin-bottom:6px;">Sign In to CA Work Tracker</h2>
      <div class="mut" style="margin-bottom:18px;">Neon PostgreSQL Cloud Connected &bull; Multi-ID Login</div>
      <form onsubmit="event.preventDefault(); login(this.u.value, this.p.value);">
        <label class="mut" style="font-size:12px;display:block;margin-bottom:4px;">Username</label>
        <input style="width:100%;margin-bottom:12px;" type="text" name="u" placeholder="admin or rohit" required autofocus>
        <label class="mut" style="font-size:12px;display:block;margin-bottom:4px;">Password</label>
        <input style="width:100%;margin-bottom:16px;" type="password" name="p" placeholder="••••••••" required>
        <button class="btn" style="width:100%;" type="submit">Log In</button>
      </form>
      <div style="margin-top:20px;border-top:1px solid var(--bd);padding-top:14px;">
        <span class="mut" style="font-size:12px;display:block;margin-bottom:6px;">Quick 1-Click Access:</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="chip-login" onclick="login('admin','admin')">👑 Admin (admin:admin)</button>
          <button class="chip-login" onclick="login('manager','manager')">💼 Manager (manager:manager)</button>
          <button class="chip-login" onclick="login('rohit','staff')">📝 Article (rohit:staff)</button>
        </div>
      </div>
    </div>`;
  },

  dash() {
    const td = today(), open = db.tasks.filter(t => t.status !== 'Completed'), dl = db.logs.filter(l => l.date === td);
    const hrs = dl.reduce((a, l) => a + (+l.hours || 0), 0);
    return `<div class="grid">
      <div class="stat"><b>${open.length}</b><span>Pending tasks</span></div>
      <div class="stat"><b style="color:var(--bad)">${open.filter(isOd).length}</b><span>Overdue</span></div>
      <div class="stat"><b>${dl.length}</b><span>Work entries today</span></div>
      <div class="stat"><b>${hrs.toFixed(1)}</b><span>Hours logged today</span></div>
      <div class="stat"><b>${db.clients.length}</b><span>Clients</span></div>
    </div>
    <div class="two">
      <div class="panel"><h2>Today’s work (${fmt(td)})</h2>${dl.length ? `<div class="tw"><table>${dl.map(l => `<tr><td><b>${esc(cn(l.client))}</b><br>${esc(l.work)}</td><td>${esc(en(l.emp))}</td></tr>`).join('')}</table></div>` : '<div class="empty">Nothing logged today yet.</div>'}</div>
      <div class="panel"><h2>Team workload</h2>${db.emps.length ? `<div class="tw"><table><tr><th>Employee</th><th>Pending</th><th>Done today</th></tr>${db.emps.map(e => `<tr><td>${esc(e.name)}</td><td>${open.filter(t => t.emp === e.id).length}</td><td>${dl.filter(l => l.emp === e.id).length}</td></tr>`).join('')}</table></div>` : '<div class="empty">Add team members in the Team tab.</div>'}</div>
    </div>
    <div class="panel"><h2>Client-wise pending work</h2>${db.clients.length ? `<div class="tw"><table><tr><th>Client</th><th>Pending</th><th>Overdue</th><th>Next due</th></tr>${db.clients.map(c => { const o = open.filter(t => t.client === c.id), nd = o.map(t => t.due).filter(Boolean).sort()[0]; return `<tr><td><a href="#" onclick="clientView('${c.id}');return false">${esc(c.name)}</a></td><td>${o.length}</td><td>${o.filter(isOd).length}</td><td>${fmt(nd)}</td></tr>`; }).join('')}</table></div>` : '<div class="empty">Start by adding your clients.</div>'}</div>`;
  },

  tasks() {
    let l = db.tasks.filter(t => (f.ts === 'Open' ? t.status !== 'Completed' : f.ts === 'All' || t.status === f.ts) && (!f.tc || t.client === f.tc) && (!f.te || t.emp === f.te));
    l.sort((a, b) => (a.due || '9').localeCompare(b.due || '9'));
    return `<div class="bar">
      <select onchange="f.ts=this.value;render()">${opt(['Open', 'Pending', 'In Progress', 'Completed', 'All'], f.ts)}</select>
      <select onchange="f.tc=this.value;render()">${opt(cOpts(), f.tc, 'All clients')}</select>
      <select onchange="f.te=this.value;render()">${opt(eOpts(), f.te, 'All employees')}</select>
      <span class="sp"></span><button class="btn" onclick="taskForm()">+ New task</button>
    </div>
    <div class="panel">${taskRows(l)}</div>`;
  },

  log() {
    let l = db.logs.filter(x => (!f.ld || x.date === f.ld) && (!f.le || x.emp === f.le) && (!f.lc || x.client === f.lc)).sort((a, b) => b.date.localeCompare(a.date));
    const h = l.reduce((a, x) => a + (+x.hours || 0), 0);
    return `<div class="bar">
      <input type="date" value="${f.ld}" onchange="f.ld=this.value;render()">
      <button class="btn g s" onclick="f.ld='';render()">All dates</button>
      <select onchange="f.lc=this.value;render()">${opt(cOpts(), f.lc, 'All clients')}</select>
      <select onchange="f.le=this.value;render()">${opt(eOpts(), f.le, 'All employees')}</select>
      <span class="sp"></span><button class="btn" onclick="logForm()">+ Add work done</button>
    </div>
    <div class="panel">${l.length ? `<div class="mut" style="margin-bottom:8px">${l.length} entries · ${h.toFixed(1)} hours</div><div class="tw"><table><tr><th>Date</th><th>Client</th><th>Work done</th><th>Done by</th><th>Hrs</th><th></th></tr>${l.map(x => `<tr><td>${fmt(x.date)}</td><td>${esc(cn(x.client))}</td><td>${esc(x.work)}</td><td>${esc(en(x.emp))}</td><td>${esc(x.hours || '')}</td><td style="white-space:nowrap"><button class="btn g s" onclick="logForm('${x.id}')">Edit</button> <button class="btn d s" onclick="del('logs','${x.id}')">✕</button></td></tr>`).join('')}</table></div>` : '<div class="empty">No work recorded for this selection.</div>'}</div>`;
  },

  clients() {
    return `<div class="bar"><span class="sp"></span><button class="btn" onclick="clientForm()">+ New client</button></div>
    <div class="panel">${db.clients.length ? `<div class="tw"><table><tr><th>Client</th><th>Type</th><th>PAN</th><th>GSTIN</th><th>Contact</th><th>Pending</th><th></th></tr>${db.clients.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.type || '')}</td><td><code>${esc(c.pan || '')}</code></td><td><code>${esc(c.gstin || '')}</code></td><td>${esc(c.phone || '')}</td><td>${db.tasks.filter(t => t.client === c.id && t.status !== 'Completed').length}</td><td style="white-space:nowrap"><button class="btn s" onclick="clientView('${c.id}')">Open</button> <button class="btn g s" onclick="clientForm('${c.id}')">Edit</button> <button class="btn d s" onclick="del('clients','${c.id}','Delete this client and all its records?')">✕</button></td></tr>`).join('')}</table></div>` : '<div class="empty">No clients yet.</div>'}</div>`;
  },

  team() {
    return `<div class="bar"><span class="sp"></span><button class="btn" onclick="empForm()">+ Add team member</button></div>
    <div class="panel">${db.emps.length ? `<div class="tw"><table><tr><th>Name</th><th>Role</th><th>Pending</th><th>Total entries</th><th></th></tr>${db.emps.map(e => `<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.role || '')}</td><td>${db.tasks.filter(t => t.emp === e.id && t.status !== 'Completed').length}</td><td>${db.logs.filter(l => l.emp === e.id).length}</td><td><button class="btn d s" onclick="del('emps','${e.id}','Remove this team member?')">✕</button></td></tr>`).join('')}</table></div>` : '<div class="empty">Add the people who do the work.</div>'}</div>`;
  },

  users() {
    return `<div class="bar">
      <span class="mut" style="font-size:13px;">Manage IDs and passwords (synced directly with Neon PostgreSQL)</span>
      <span class="sp"></span>
      <button class="btn" onclick="userForm()">+ Add User ID &amp; Password</button>
    </div>
    <div class="panel">${db.users.length ? `<div class="tw"><table><tr><th>Username</th><th>Display Name</th><th>Role</th><th>Password</th><th></th></tr>${db.users.map(u => `<tr><td><b>@${esc(u.username)}</b></td><td>${esc(u.name)}</td><td><span class="b ${u.role === 'Admin' ? 'High' : 'Medium'}">${esc(u.role)}</span></td><td><span class="mut">Encrypted</span></td><td style="white-space:nowrap"><button class="btn g s" onclick="resetUserPass('${u.id}')">Change Password</button> ${u.id !== (currentUser ? currentUser.id : '') ? `<button class="btn d s" onclick="del('users','${u.id}','Delete this user ID?')">✕</button>` : ''}</td></tr>`).join('')}</table></div>` : '<div class="empty">No users configured.</div>'}</div>`;
  }
};

function render() {
  const hdrUser = document.getElementById('hdrUser');
  const nav = document.getElementById('nav');
  const v = document.getElementById('v');

  if (!currentUser) {
    hdrUser.innerHTML = '';
    nav.innerHTML = '';
    v.innerHTML = V.login();
    return;
  }

  hdrUser.innerHTML = `
    <div class="hdr-user">
      <b>${esc(currentUser.name)}</b> <span style="opacity:0.8;">(${esc(currentUser.role)})</span>
    </div>
    <button class="hdr-btn" onclick="logout()">Logout</button>
  `;

  nav.innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  v.innerHTML = (V[tab] || V.dash)();
}

const nav = document.getElementById('nav'), v = document.getElementById('v'), m = document.getElementById('m');
syncWithNeon();
render();
</script>
</body>
</html>
